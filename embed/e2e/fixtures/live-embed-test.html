<!DOCTYPE html>
<!--
  live-embed-test.html — Part B fixture for real embed E2E tests.

  This page mounts <nubi-query-editor> against a LIVE backend URL.  The
  backend URL and token endpoint are injected via URL query parameters so
  the Playwright test can point at the per-run uvicorn port:

    ?backend=http://127.0.0.1:<PORT>/api/v1
    &token=<JWT string>          (pre-minted by the test; avoids needing a token endpoint)

  Components:
    #qe-metric   — <nubi-query-editor> in metric mode (author:metric token)

  State indicators written to DOM by the page script so Playwright can poll:
    #status        — "ready" once the page has injected the token
    .data-rows     — updated by nubi:run event with row count from the live backend
    .error-msg     — updated by nubi:error event
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nubi Live Embed E2E Fixture</title>

  <!-- Load the embed bundle (served from repo root via python3 http.server) -->
  <script type="module" src="/embed/dist/nubi-embed.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1117;
      color: #e2e8f0;
      font-family: system-ui, sans-serif;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    h2 { font-size: 14px; color: #a0aec0; margin-bottom: 8px; }
    .section { display: flex; flex-direction: column; gap: 8px; }
    .status-bar {
      font-size: 11px;
      font-family: monospace;
      padding: 6px 10px;
      background: #1a1f2e;
      border-radius: 4px;
      border: 1px solid #2d3748;
    }
    .status-bar span { color: #68d391; }
    .error-msg { color: #fc8181; font-size: 11px; font-family: monospace; }
    .data-rows { color: #68d391; font-size: 11px; font-family: monospace; }
    nubi-query-editor    { height: 260px;     width: 100%; border-radius: 8px; }
  </style>
</head>
<body>

<div class="status-bar">
  Status: <span id="status">initialising</span> |
  Backend: <span id="backend-display">—</span>
</div>

<!-- ── Section 1: query-editor in metric mode (author:metric) ─────────────── -->
<div class="section" id="section-qe-metric">
  <h2>query-editor — author:metric mode (live backend)</h2>
  <div class="data-rows" id="rows-qe-metric">rows: —</div>
  <div class="error-msg" id="error-qe-metric"></div>
  <nubi-query-editor
    id="qe-metric"
    mode="auto"
    metric-id="retail_nsv"
  ></nubi-query-editor>
</div>

<script type="module">
  // ── Parse URL params ────────────────────────────────────────────────────────
  const params = new URLSearchParams(location.search)
  const backendBase = params.get('backend') || 'http://localhost:8000/api/v1'
  // Normalise: strip trailing /api/v1 if present — components expect the base URL
  // without the /api/v1 prefix (they append it themselves).
  const backendRoot = backendBase.replace(/\/api\/v1\/?$/, '')

  // author:metric token — used by the query-editor fixture below
  const authorToken = params.get('author_token')

  document.getElementById('backend-display').textContent = backendRoot

  // ── Wire components ─────────────────────────────────────────────────────────
  function wireComponent(el, token) {
    el.setAttribute('backend', backendRoot)
    if (token) {
      el.setAttribute('token', token)
    }
  }

  // Wait for custom elements to define (they register on module import)
  customElements.whenDefined('nubi-query-editor').then(() => {
    const qeMetric = document.getElementById('qe-metric')

    wireComponent(qeMetric, authorToken)

    document.getElementById('status').textContent = 'ready'
  })

  // ── Listen for data events from the components ──────────────────────────────
  // nubi:run fires AFTER a run completes with result rows from the server.
  // We capture row counts here so Playwright can poll them.
  document.addEventListener('nubi:run', (e) => {
    const detail = e.detail || {}
    const src    = e.target?.id || 'unknown'
    const count  = detail.rowCount ?? detail.rows?.length ?? '?'

    if (src === 'qe-metric') {
      document.getElementById('rows-qe-metric').textContent = `rows: ${count}`
    }
  })

  document.addEventListener('nubi:error', (e) => {
    const detail = e.detail || {}
    const src    = e.target?.id || 'unknown'
    const msg    = detail.message || 'unknown error'

    if (src === 'qe-metric') {
      document.getElementById('error-qe-metric').textContent = `error: ${msg}`
    }
  })
</script>
</body>
</html>
