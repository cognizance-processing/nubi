<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nubi — &lt;nubi-lineage&gt; demo</title>
  <script type="module" src="../dist/nubi-embed.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f1117; color: #e2e8f0; font-family: system-ui, sans-serif; padding: 24px; }
    h1 { font-size: 18px; color: #6366f1; margin-bottom: 8px; }
    p  { font-size: 12px; color: #718096; margin-bottom: 20px; }
    h2 { font-size: 12px; color: #a0aec0; margin: 24px 0 10px; text-transform: uppercase; letter-spacing: .04em; }
    .row { display: flex; flex-wrap: wrap; gap: 16px; }
    nubi-lineage { display: block; min-height: 240px; width: 480px; max-width: 100%; }
    .light-bg {
      background: #f8f9fc;
      padding: 20px;
      border-radius: 8px;
      margin-top: 24px;
    }
    .light-bg h2 { color: #4a5568; }
    #event-log {
      margin-top: 24px;
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 11px;
      font-family: monospace;
      color: #a0aec0;
      min-height: 60px;
      max-height: 200px;
      overflow: auto;
    }
    #event-log p { color: #718096; margin: 0 0 6px; }
  </style>
  <script>
    // Expose a demo token getter (simulates a real auth flow)
    window.getToken = () => Promise.resolve('demo-token-abc123')
  </script>
</head>
<body>
  <h1>&lt;nubi-lineage&gt; — DAG lineage graph</h1>
  <p>
    Live widget (left) attempts to load from <code>http://localhost:8000</code> and falls back to sample data.
    Sample-only widget (right) always shows sample data.
  </p>

  <h2>Dark theme</h2>
  <div class="row">
    <!-- Attempts live backend; falls back to sample -->
    <nubi-lineage
      id="live-dark"
      backend="http://localhost:8000"
      get-token="getToken"
      theme="dark">
    </nubi-lineage>

    <!-- Always uses sample data (no backend attribute) -->
    <nubi-lineage
      id="sample-dark"
      theme="dark">
    </nubi-lineage>
  </div>

  <div class="light-bg">
    <h2>Light theme</h2>
    <div class="row">
      <nubi-lineage
        id="live-light"
        backend="http://localhost:8000"
        get-token="getToken"
        theme="light">
      </nubi-lineage>

      <nubi-lineage
        id="sample-light"
        theme="light">
      </nubi-lineage>
    </div>
  </div>

  <h2>Event log</h2>
  <div id="event-log">
    <p>Click a node to emit nubi:select — events appear here.</p>
  </div>

  <script>
    const log = document.getElementById('event-log')
    function addLog(msg) {
      const line = document.createElement('div')
      line.textContent = '[' + new Date().toISOString().slice(11, 19) + '] ' + msg
      log.appendChild(line)
      log.scrollTop = log.scrollHeight
    }

    document.querySelectorAll('nubi-lineage').forEach(el => {
      el.addEventListener('nubi:select', (e) => {
        addLog('nubi:select — node.id=' + e.detail.node.id + ' type=' + e.detail.node.type)
      })
      el.addEventListener('nubi:widget-ready', (e) => {
        addLog('nubi:widget-ready (' + el.id + ') — nodes=' + e.detail.nodes + ' edges=' + e.detail.edges)
      })
      el.addEventListener('nubi:widget-error', (e) => {
        addLog('nubi:widget-error (' + el.id + ') — ' + e.detail.message)
      })
    })
  </script>
</body>
</html>
