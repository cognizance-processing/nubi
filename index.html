    <!-- FAQ structured data — eligible for rich results; answers stay honest
         about how the product actually works (embedding uses registered
         queries / saved dashboards, not arbitrary raw SQL). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is Nubi really free for unlimited dashboard viewers?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Every plan, including the free tier, allows unlimited viewers and seats. The DuckDB-WASM kernel runs in each viewer's browser tab, so a dashboard view costs essentially nothing — there is no per-viewer or per-seat charge."
            }
          },
          {
            "@type": "Question",
            "name": "How does embedded analytics work in Nubi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Drop the <nubi-dashboard> web component into your app and point it at a saved dashboard or a registered query. Your backend signs a short-lived JWT carrying per-viewer row-level-security claims; Nubi injects those predicates into the SQL AST before any data leaves the connector. Embedded tokens reference registered queries — arbitrary raw SQL is intentionally not permitted on the embed path for security."
            }
          },
          {
            "@type": "Question",
            "name": "Can I self-host Nubi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Nubi's core is open source under Apache-2.0 and can be self-hosted, including running connectors inside your own VPC so warehouse credentials never leave your network."
            }
          },
          {
            "@type": "Question",
            "name": "Which data sources does Nubi connect to?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Nubi ships 25+ connectors out of the box — including BigQuery, Snowflake, Redshift, Postgres, and ClickHouse — plus a Python connector SDK that wraps any Arrow-returning function as a first-class, fail-closed source."
            }
          }
        ]
      }
    </script>

    <!-- ── No-FOUC theme script ─────────────────────────────────────────────
         Runs synchronously before any paint. Reads localStorage then
         prefers-color-scheme to set the initial `dark` class on <html>
         before CSS or React load, preventing flash of wrong theme.
    ──────────────────────────────────────────────────────────────────────── -->
    <script>
      (function () {
        try {
          var qp = new URLSearchParams(location.search).get('theme');
          if (qp === 'dark' || qp === 'light') { localStorage.setItem('nubi-theme', qp); }
          var stored = localStorage.getItem('nubi-theme');
          if (stored === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          // localStorage may be blocked (private mode, permissions policy) — fail silently
        }
      })();
    </script>

    <!-- ── Fonts ─────────────────────────────────────────────────────────────
         Instrument Sans (UI + display) and Geist Mono (data) are the only fonts the
         app shell needs, so they are the only render-blocking stylesheet. Inter,
         Space Grotesk and JetBrains Mono are still named by saved boards; they
         load in a second, NON-blocking stylesheet (media swap) and never delay
         first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"

    </noscript>
