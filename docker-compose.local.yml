name: nubi-local

# One-instance local run of the Nubi CLOUD build (combined EE image) for testing
# code end-to-end with a .env. Runs the WHOLE product as a SINGLE app container
# — API + SPA + in-process demo DuckDB — alongside a
# local Postgres and MinIO. Build context is the repo root (your working tree), so you
# test your current code. First build runs npm + vite + pip, so it's a few
# minutes; for fast hot-reload dev use nubi's own docker-compose instead.
#
#   cp .env.local.example .env.local   # fill in NUBI_LICENSE_KEY, JWT_SECRET, …
#   scripts/dev-local.sh               # (docker compose -f docker-compose.local.yml up --build)
#   open http://localhost:8000         # MinIO console: http://localhost:9001

volumes:
  pg_data:
  minio_data:

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nubi
      POSTGRES_PASSWORD: nubi
      POSTGRES_DB: nubi
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nubi -d nubi"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/nubi &&
        echo 'bucket nubi ready'
      "

  # THE single Nubi instance — combined EE image (API + SPA + app/ee), built from
  # your local nubi working tree. Runs migrations (incl. --ee) then serves.
  nubi:
    build:
      context: ..
      dockerfile: Dockerfile.ee
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://nubi:nubi@db:5432/nubi
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      S3_BUCKET: nubi
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    command: >
      sh -c "python /app/database/migrate.py --ee &&
             exec uvicorn main:app --host 0.0.0.0 --port 8000"
