[pytest]
# Per-test wall-clock timeout (pytest-timeout). No single test may hang the
# suite or CI: a genuine hang — e.g. a kernel subprocess whose grandchild
# escaped the process group and held a pipe open — fails THAT test at 120s with
# a stack dump, instead of blocking the entire run indefinitely. The full suite
# was validated green under this bound (every test completes well under it).
# 'thread' method is used because 'signal' (SIGALRM) is unreliable with the
# async/threaded test paths here.
timeout = 120
timeout_method = thread

# Registered markers (silences PytestUnknownMarkWarning; not strict, so other
# marks still work).
markers =
    slow: long-running / perf-benchmark tests (deselect with -m "not slow")
