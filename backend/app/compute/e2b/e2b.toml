# Nubi attribution sandbox — E2B template manifest.
#
# This file is consumed by the E2B CLI (`e2b template build`).  It pairs with
# e2b.Dockerfile in this directory to define the custom sandbox image that the
# production remote kernel runs BYO-model attribution code inside.
#
# After `e2b template build` succeeds it prints a template id; the same id is
# written back into the `template_id` field below by the CLI.  Wire that id
# into the backend via the E2B_TEMPLATE environment variable so E2BRunner
# (backend/app/compute/remote_e2b.py) creates sandboxes from this template.
#
# See docs/compute-kernel-attribution-runner.md and README.md (this directory).

# Human-readable template name (used by `e2b template build`).
name = "nubi-attribution-runner"

# Path to the Dockerfile that defines the sandbox image (relative to this file).
dockerfile = "e2b.Dockerfile"

# Command run when the sandbox starts. Empty = use the base image's default
# (the E2B agent). The Nubi kernel writes/execs the harness per call, so no
# custom start command is needed here. (Per-call wall-clock is enforced in the
# backend at 120 s — see routes/compute.py — not via this manifest.)
start_cmd = ""

# template_id is populated by `e2b template build` after the first successful
# build+publish.  Until then it is intentionally blank: the backend falls back
# to the E2B base image when E2B_TEMPLATE is unset.
template_id = ""
